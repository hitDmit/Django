[coverage:report]
precision = 2
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    raise NotImplemented

[coverage:run]
source = src
branch = True

[flake8]
extend-ignore = I100,I101,E203
exclude = .git,__pycache__,.venv
max-line-length = 100
max-complexity = 10
max-annotations-complexity = 3
max-cognitive-complexity = 7
import-order-style = edited

[mypy]
python_version = 3.12
disallow_untyped_defs = True
ignore_missing_imports = True
exclude = \.venv.*

[tool:brunette]
target-version = py310
line-length = 99
single-quotes = True

[tool:pytest]
pythonpath = src
